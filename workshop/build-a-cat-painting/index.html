<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fCC Cat Painting</title>

  <!-- Step 01 | Link the stylesheet. -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Steps 10 and 15 | Add the scroll test box, then remove it.
  <div class="box"></div>
  -->

  <!-- Step 04 | Add the main element and cat head. -->
  <main>
    <div class="cat-head">
      <!-- Step 17 | Create the ears container. -->
      <div class="cat-ears">
        <!-- Step 18 | Add the left and right outer ears.
             Step 19 | Nest an inner ear inside each outer ear. -->
        <div class="cat-left-ear">
          <div class="cat-left-inner-ear"></div>
        </div>
        <div class="cat-right-ear">
          <div class="cat-right-inner-ear"></div>
        </div>
      </div>

      <!-- Step 39 | Create the eyes container and both outer eyes.
           Step 40 | Nest an inner eye inside each outer eye. -->
      <div class="cat-eyes">
        <div class="cat-left-eye">
          <div class="cat-left-inner-eye"></div>
        </div>
        <div class="cat-right-eye">
          <div class="cat-right-inner-eye"></div>
        </div>
      </div>

      <!-- Step 51 | Add the nose. -->
      <div class="cat-nose"></div>

      <!-- Step 55 | Create the mouth container. -->
      <div class="cat-mouth">
        <!-- Step 56 | Add both mouth lines. -->
        <div class="cat-mouth-line-left"></div>
        <div class="cat-mouth-line-right"></div>
      </div>

      <!-- Step 63 | Create the whiskers container. -->
      <div class="cat-whiskers">
        <!-- Step 64 | Create one group for each side. -->
        <div class="cat-whiskers-left">
          <!-- Step 65 | Add the three left whiskers. -->
          <div class="cat-whisker-left-top"></div>
          <div class="cat-whisker-left-middle"></div>
          <div class="cat-whisker-left-bottom"></div>
        </div>
        <div class="cat-whiskers-right">
          <!-- Step 66 | Add the three right whiskers. -->
          <div class="cat-whisker-right-top"></div>
          <div class="cat-whisker-right-middle"></div>
          <div class="cat-whisker-right-bottom"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
